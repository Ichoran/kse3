# Cross-platform CI.  The native job is the reason this exists: kse.eio's descriptor-passing sockets
# and shared memory (PosixSocket, FdSock, SharedMemory) are written for Linux, macOS on both
# architectures, and Windows (named shared memory only), and eio's NativeTest pins each platform's
# behaviour with real system calls -- struct layouts, errno values, the per-message descriptor limit,
# close-on-exec on received descriptors, shm_open's variadic mode on Darwin, and Windows answering
# "unsupported" cleanly.  The suite job is the ordinary regression run; thyme stays off shared runners
# because its tests are timing-calibrated, and Windows runs only the platform-neutral modules until the
# file-system-heavy eio suite has been made Windows-aware.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mill
      - name: Native layer (PosixSocket, FdSock, SharedMemory)
        shell: bash
        run: ./mill${{ runner.os == 'Windows' && '.bat' || '' }} eio.test.testOnly kse.test.eio.NativeTest

  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: basics.test + flow.test + maths.test + loom.test + eio.test + jsaun.test + alien.test
          - os: macos-15
            tasks: basics.test + flow.test + maths.test + eio.test
          - os: windows-latest
            tasks: basics.test + flow.test + maths.test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mill
      - name: Test
        shell: bash
        run: ./mill${{ runner.os == 'Windows' && '.bat' || '' }} ${{ matrix.tasks }}
