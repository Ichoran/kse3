name: Set up Mill
description: The Coursier and Mill caches and the Mill bootstrap launcher, which fetches the Mill version and the JDK that build.mill names

inputs:
  jvm:
    description: A JDK to use in place of build.mill's mill-jvm-version, for a platform where Mill's default vendor has no build
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Override the JDK
      if: inputs.jvm != ''
      shell: bash
      env:
        JVM: ${{ inputs.jvm }}
      run: |
        sed -i.orig -E "s#^(//[|] *mill-jvm-version:).*#\1 $JVM#" build.mill
        rm build.mill.orig
        grep -F "mill-jvm-version: $JVM" build.mill

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/mill
          ~/.cache/coursier
          ~/Library/Caches/mill
          ~/Library/Caches/Coursier
          ~/AppData/Local/mill
          ~/AppData/Local/Coursier/Cache
        key: mill-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.mill') }}
        restore-keys: |
          mill-${{ runner.os }}-${{ runner.arch }}-

    - name: Fetch the Mill launcher
      shell: bash
      run: |
        version=$(sed -nE 's#^//[|] *mill-version: *##p' build.mill | tr -d ' \r')
        if [ -z "$version" ]; then
          echo "build.mill has no '//| mill-version:' header" >&2
          exit 1
        fi
        base="https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/$version/mill-dist-$version"
        if [ "$RUNNER_OS" = Windows ]; then
          curl -fsSL -o mill.bat "$base-mill.bat"
        else
          curl -fsSL -o mill "$base-mill.sh"
          chmod +x mill
        fi
        echo "Mill $version"
